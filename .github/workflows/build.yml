name: Build Tame Player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (Onn, Shield, phones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Fills in the standard Flutter project files we don't keep in the repo (it never overwrites ours)
      - run: flutter create --org com.tameplayer --project-name tame_player --platforms=android,windows .
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk TamePlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TamePlayer-Android
          path: TamePlayer.apk

  windows:
    name: Windows laptop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.tameplayer --project-name tame_player --platforms=android,windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TamePlayer-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TamePlayer-Windows
          path: TamePlayer-Windows.zip

  release:
    name: Publish download
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tame Player (build ${{ github.run_number }})
          body: |
            Windows: download TamePlayer-Windows.zip, unzip it, and open tame_player.exe.
            Android / Google TV: install TamePlayer.apk.
          files: |
            TamePlayer.apk
            TamePlayer-Windows.zip
